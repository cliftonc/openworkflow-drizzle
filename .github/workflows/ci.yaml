name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: ci (drizzle ${{ matrix.drizzle }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # the devDependencies cover drizzle-orm 0.45 / drizzle-kit 0.31
        drizzle: ["0.x", "rc"]
    services:
      postgres:
        image: postgres
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # until an openworkflow release has `openworkflow/backend` and
      # `openworkflow/testing`, build it from the fork branch
      - run: sh scripts/link-openworkflow.sh ${{ matrix.drizzle == 'rc' && 'drizzle-orm@rc drizzle-kit@rc' || '' }}
      - run: npm run ci
